aid: epignosis-talentlms-efront-talentcards
name: Epignosis (TalentLMS, eFront, TalentCards)
description: >-
  Epignosis is a learning-technology company serving more than 70,000 organizations
  worldwide with a family of cloud training products: TalentLMS (an all-in-one LMS for
  growing businesses), eFront (a flexible enterprise LMS), TalentCards (mobile-first
  microlearning for deskless workers) and TalentHR. Each product exposes a REST API for
  managing users, courses, groups, branches, enrollments, and reporting. The TalentLMS
  API is a JSON REST API scoped to a per-tenant subdomain with API-key HTTP Basic auth
  and per-plan hourly rate limits; eFront publishes an OpenAPI 3.0 definition on
  SwaggerHub; TalentCards ships a PHP API wrapper. Epignosis holds ISO/IEC 27001:2022,
  ISO 9001:2015, CSA STAR Level 1 and is GDPR compliant.
