  description: >-
    JSON REST API for TalentLMS, scoped to a per-tenant subdomain (https://{domain}.talentlms.com/api/v1/).
    Manages users, courses, categories, groups, branches, enrollments, units, tests, surveys, ILT sessions,
    and timeline reporting. Authenticated with an API key over HTTP Basic auth; per-plan hourly rate limits
    plus a global cap of 200 calls / 5 seconds.
